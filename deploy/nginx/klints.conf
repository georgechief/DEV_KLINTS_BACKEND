# Reverse proxy for apis.klints.io — HTTP→HTTPS + Let's Encrypt webroot.
# M3-OBS-01 Phase 3: Grafana at /grafana/ (login required; no public :3000).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream klints_web {
    server web:8000;
}

upstream klints_grafana {
    server grafana:3000;
}

# ACME HTTP-01 + redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name apis.klints.io;

    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location /health/ {
        proxy_pass http://klints_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apis.klints.io;

    ssl_certificate     /etc/letsencrypt/live/apis.klints.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apis.klints.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # OCSP stapling (best-effort; ignored if CA doesn't support it)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 50m;

    # Keep /health/ on HTTPS for deploy smoke (unchanged contract).
    location /health/ {
        proxy_pass http://klints_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # M3-OBS-01 — Grafana ops UI (GF_SERVER_ROOT_URL=…/grafana/ + SERVE_FROM_SUB_PATH).
    # Auth is Grafana native login (anonymous disabled). Do not publish grafana:3000 on host.
    location = /grafana {
        return 301 https://$host/grafana/;
    }

    location /grafana/ {
        proxy_pass http://klints_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://klints_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
